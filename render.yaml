services:
  # DocuMind AI - FastAPI Backend Service on Render
  - type: web
    name: documind-ai-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: documind-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_DIR
        value: /var/data/pdfs
      - key: CHROMA_PERSIST_DIR
        value: /var/data/chromadb
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
    disk:
      name: documind-data
      mountPath: /var/data
      sizeGB: 10

databases:
  # Managed PostgreSQL Database on Render
  - name: documind-postgres
    plan: basic
    databaseName: documind
    user: documind_admin
